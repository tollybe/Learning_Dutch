name: Project documentation status
on:
  workflow_dispatch:
  push:
    paths:
      - progress/project-state.json
      - scripts/update_status.py
      - .github/workflows/project-status.yml
  schedule:
    - cron: '15 19 * * 0'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate status from evidence
        run: python scripts/update_status.py
      - name: Commit status only if changed
        run: |
          if ! git diff --quiet -- docs/STATUS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/STATUS.md
            git commit -m "docs: refresh evidence-based learning project status"
            git push
          fi
