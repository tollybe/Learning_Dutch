name: Project documentation status
on:
  workflow_dispatch:
  push:
    paths:
      - README.md
      - docs/LEARNING_PLAN.md
      - docs/AI_AGENT.md
      - progress/project-state.json
      - scripts/assess_project.py
      - scripts/update_status.py
      - .github/workflows/project-status.yml
  schedule:
    - cron: '15 19 * * 0'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify objective repository evidence
        run: python scripts/assess_project.py
      - name: Generate project status
        run: python scripts/update_status.py
      - name: Commit refreshed evidence and status when changed
        run: |
          if ! git diff --quiet -- progress/project-state.json docs/STATUS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add progress/project-state.json docs/STATUS.md
            git commit -m "docs: refresh evidence-based project status"
            git push
          fi
