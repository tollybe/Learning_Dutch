name: Sync approved public learning material

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-public.yml'
      - 'scripts/sync_public.py'
  schedule:
    # Mondays, 04:10 UTC (after the public Sunday archive).
    - cron: '10 4 * * 1'

permissions:
  contents: read

jobs:
  sync-public:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private learning repository
        uses: actions/checkout@v4
      - name: Clone merged public material without private credentials
        shell: bash
        run: git clone --quiet --depth 1 --branch main https://github.com/tollybe/Learning_Dutch.git .public_checkout
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy approved public material only
        shell: bash
        run: |
          python scripts/sync_public.py --source .public_checkout --commit "$(git -C .public_checkout rev-parse HEAD)"
          rm -rf .public_checkout
      - name: Commit only the private public_reference directory
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- public_reference)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- public_reference
            git commit -m "docs: sync approved public Dutch-learning materials"
            git push
          else
            echo "Public learning reference is already up to date."
          fi
